spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=smart_campus_db
spring.datasource.username=${DB_USERNAME:PostgreSQL 18}
spring.datasource.password=${DB_PASSWORD:0522}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=smart_campus_db

server.port=8081

app.jwt.secret=${APP_JWT_SECRET:SmartCampusJwtSecretKeyForHs256MustBeLongEnough123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
